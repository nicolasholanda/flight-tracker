services:
  bot:
    build: .
    image: flight-tracker
    env_file: .env
    environment:
      DATABASE_PATH: /data/flight-tracker.db
      TZ: ${TIMEZONE:-America/Fortaleza}
    volumes:
      - flight-data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  flight-data:
